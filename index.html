<!DOCTYPE html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>Xidmətin təşkili və iş şəraiti üzrə sorğu</title>
    <style>
      :root {
        --bg: #f3f5f4;
        --surface: #ffffff;
        --ink: #16211f;
        --muted: #5b6966;
        --line: #d5dcda;
        --accent: #1f5c52;
        --accent-ink: #ffffff;
        --accent-soft: #e3eeeb;
        --warn: #8a5200;
        --warn-soft: #fff3dc;
        --ok: #1f7a4d;
        --err: #b3261e;
        --err-soft: #fce9e7;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1514;
          --surface: #182120;
          --ink: #e6ecea;
          --muted: #9aa8a5;
          --line: #2c3a37;
          --accent: #6fc3b2;
          --accent-ink: #0b1a17;
          --accent-soft: #1f3a35;
          --warn: #f0b95a;
          --warn-soft: #3a2e14;
          --ok: #6fcf97;
          --err: #f2857c;
          --err-soft: #3a1d1a;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans",
          Arial, sans-serif;
        font-size: 16px;
        line-height: 1.45;
        padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }

      /* Yuxarı zolaq */
      .top {
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        padding-top: env(safe-area-inset-top, 0px);
      }
      .top-row {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 10px 16px 6px;
        max-width: 820px;
        margin: 0 auto;
      }
      .top-title {
        font-size: 15px;
        font-weight: 650;
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .top-pct {
        font-size: 14px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .bar {
        height: 4px;
        background: var(--line);
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width 0.25s;
      }
      .tabs {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 8px 16px;
        max-width: 820px;
        margin: 0 auto;
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar {
        display: none;
      }
      .tab {
        flex: 0 0 auto;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 14px;
        min-height: 40px;
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
      }
      .tab[aria-selected="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
      }
      .tab .cnt {
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        opacity: 0.8;
      }
      .tab.done .cnt {
        font-weight: 700;
      }

      main {
        max-width: 820px;
        margin: 0 auto;
        padding: 16px;
      }
      .panel {
        display: none;
      }
      .panel.on {
        display: block;
      }
      h1 {
        font-size: 22px;
        line-height: 1.25;
        margin: 4px 0 6px;
      }
      h2 {
        font-size: 17px;
        margin: 28px 0 10px;
      }
      .lead {
        color: var(--muted);
        margin: 0 0 16px;
        font-size: 15px;
      }
      .note {
        background: var(--accent-soft);
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 14.5px;
        margin: 0 0 16px;
      }
      .note ol {
        margin: 0;
        padding-left: 20px;
      }
      .note li {
        margin: 4px 0;
      }
      .banner {
        background: var(--warn-soft);
        color: var(--warn);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 14px;
        margin: 0 0 14px;
      }
      details.ex {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 14px;
        margin: 0 0 16px;
        background: var(--surface);
        font-size: 14.5px;
      }
      details.ex summary {
        cursor: pointer;
        font-weight: 600;
      }
      details.ex p {
        margin: 8px 0 0;
      }

      /* Sahələr */
      .field {
        margin: 0 0 16px;
        scroll-margin-top: 130px;
      }
      .field.flash {
        outline: 3px solid var(--warn);
        outline-offset: 4px;
        border-radius: 10px;
      }
      .field > label,
      .lbl {
        display: block;
        font-weight: 600;
        font-size: 15px;
        margin: 0 0 6px;
      }
      input[type="text"],
      input[type="number"],
      input[type="date"],
      select,
      textarea {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        min-height: 48px;
        font-size: 16px;
      }
      textarea {
        min-height: 76px;
        resize: vertical;
        line-height: 1.4;
        display: block;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      @media (max-width: 420px) {
        .two {
          grid-template-columns: 1fr;
          gap: 0;
        }
      }

      /* Sual bloku */
      .q {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        margin: 0 0 12px;
        scroll-margin-top: 130px;
      }
      .q.flash {
        box-shadow: 0 0 0 3px var(--warn);
      }
      .q-head {
        display: flex;
        gap: 10px;
        align-items: baseline;
        margin: 0 0 10px;
      }
      .code {
        flex: 0 0 auto;
        font-size: 13px;
        font-weight: 700;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
        min-width: 38px;
      }
      .q-text {
        font-weight: 600;
        font-size: 15.5px;
      }
      .q.ok {
        border-left: 4px solid var(--ok);
      }
      .q .field {
        margin-bottom: 10px;
      }

      .scale {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }
      @media (min-width: 560px) {
        .scale {
          grid-template-columns: repeat(10, 1fr);
        }
      }
      .opt {
        border: 1px solid var(--line);
        background: var(--bg);
        border-radius: 10px;
        min-height: 46px;
        font-size: 16px;
        font-variant-numeric: tabular-nums;
        padding: 8px 10px;
      }
      .opt.sel {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
        font-weight: 700;
      }
      .ends {
        display: flex;
        justify-content: space-between;
        font-size: 12.5px;
        color: var(--muted);
        margin: 6px 2px 0;
      }
      .opt.wide {
        width: 100%;
        margin-top: 6px;
        font-size: 15px;
      }
      .list {
        display: grid;
        gap: 6px;
      }
      .list .opt {
        text-align: left;
        font-size: 15px;
        padding: 11px 14px;
      }
      .izah {
        margin-top: 10px;
      }
      .izah .lbl,
      .sub {
        font-weight: 500;
        font-size: 14px;
        color: var(--muted);
      }
      .izah.req .lbl {
        color: var(--warn);
        font-weight: 650;
      }
      .izah.req textarea {
        border-color: var(--warn);
      }

      /* Göndər */
      .sum {
        width: 100%;
        border-collapse: collapse;
        background: var(--surface);
        border: 1px solid var(--line);
        font-size: 15px;
      }
      .sum td,
      .sum th {
        padding: 10px 12px;
        text-align: left;
        border-bottom: 1px solid var(--line);
      }
      .sum tr:last-child td {
        border-bottom: 0;
        font-weight: 700;
      }
      .sum td:last-child,
      .sum th:last-child {
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .miss {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .miss li {
        margin: 0 0 6px;
      }
      .miss button {
        width: 100%;
        text-align: left;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 14.5px;
        min-height: 44px;
      }
      .miss b {
        color: var(--accent);
      }
      .miss span {
        color: var(--muted);
      }
      .btn {
        border: 0;
        border-radius: 12px;
        min-height: 52px;
        padding: 12px 20px;
        font-size: 16px;
        font-weight: 650;
        background: var(--accent);
        color: var(--accent-ink);
        width: 100%;
      }
      .btn[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn.ghost {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
        font-weight: 550;
      }
      .btn.link {
        background: none;
        color: var(--muted);
        font-weight: 500;
        font-size: 14.5px;
        min-height: 44px;
        text-decoration: underline;
      }
      .msg {
        border-radius: 10px;
        padding: 12px 14px;
        margin: 12px 0;
        font-size: 15px;
      }
      .msg.err {
        background: var(--err-soft);
        color: var(--err);
      }
      .msg.info {
        background: var(--accent-soft);
      }
      .sent {
        text-align: center;
        padding: 48px 8px;
      }
      .sent .tick {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: var(--ok);
        color: #fff;
        font-size: 40px;
        line-height: 72px;
        margin: 0 auto 16px;
      }
      .sent p {
        color: var(--muted);
      }
      .sent .id {
        font-variant-numeric: tabular-nums;
        color: var(--ink);
        font-weight: 600;
      }

      /* Aşağı naviqasiya */
      .nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        background: var(--surface);
        border-top: 1px solid var(--line);
        padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
      }
      .nav-in {
        display: flex;
        gap: 10px;
        max-width: 820px;
        margin: 0 auto;
      }
      .nav .btn {
        min-height: 50px;
      }
      .nav .btn.ghost {
        flex: 0 0 34%;
      }
      [hidden] {
        display: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>

        <div class="top-pct" id="pct">0%</div>
      </div>
      <div class="bar"><i id="bar"></i></div>

    </header>

      </div>
    </footer>

      const E_FIELDS = [
        ["E.qurum", "Qurumun adı"],
        ["E.nov", "Qurumun növü"],
        ["E.saa", "Soyadı, adı, ata adı"],
        ["E.vezife", "Vəzifəsi"],
        ["E.rutbe", "Xüsusi rütbəsi"],
        ["E.staj", "Penitensiar xidmətdə xidmət stajı (il)"],
        ["E.muddet", "Bu qurumda iş müddəti (il)"],
        ["E.tarix", "Doldurulma tarixi"],
      ];
      const TABS = [
        { k: "E", t: "Təlimat" },
        { k: "A", t: "A. Problemlər" },
        { k: "B", t: "B. İş mühiti" },
        { k: "C", t: "C. İşin təşkili" },
        { k: "D", t: "D. Təkliflər" },
        { k: "S", t: "Göndər" },
      ];

      /* ---------- Vəziyyət və lokal yaddaş ---------- */
      const KEY = "px_sorgu_v1";
      let storageOk = true;
      function uuid() {
        if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
        return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
          const r = (Math.random() * 16) | 0;
          return (c === "x" ? r : (r & 0x3) | 0x8).toString(16);
        });
      }
      function today() {
        const d = new Date();
        const p = (n) => String(n).padStart(2, "0");
        return (
          d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate())
        );
      }
      function fresh() {
        return { id: uuid(), sent: null, tab: 0, v: { "E.tarix": today() } };
      }
      function load() {
        try {
          const raw = localStorage.getItem(KEY);
          if (!raw) return null;
          const s = JSON.parse(raw);
          return s && s.id && s.v ? s : null;
        } catch (e) {
          storageOk = false;
          return null;
        }
      }
      let saveTimer = null;
      function save(now) {
        clearTimeout(saveTimer);
        const run = () => {
          try {
            localStorage.setItem(KEY, JSON.stringify(S));
          } catch (e) {
            storageOk = false;
          }
        };
        if (now) run();
        else saveTimer = setTimeout(run, 250);
      }
      try {
        localStorage.setItem(KEY + "_t", "1");
        localStorage.removeItem(KEY + "_t");
      } catch (e) {
        storageOk = false;
      }
      let S = load() || fresh();

      /* ---------- Köməkçilər ---------- */
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c])
        );
      const val = (k) => {
        const x = S.v[k];
        return x == null ? "" : String(x).trim();
      };
      const isNum = (x) => x !== "" && !isNaN(Number(x));
      function needIzah(sec, q) {
        if (!isNum(q)) return false;
        if (sec === "A") return Number(q) >= 7;
        if (sec === "B") return Number(q) <= 3;
        return false;
      }

      /* ---------- Doldurma vəziyyəti ---------- */
      function statusList() {
        const out = [];
        E_FIELDS.forEach(([k, l]) => {
          let ok = val(k) !== "",
            why = "doldurulmayıb";
          if (ok && (k === "E.staj" || k === "E.muddet")) {
            const n = Number(val(k).replace(",", "."));
            if (isNaN(n) || n < 0 || n > 60) {
              ok = false;
              why = "0–60 arası rəqəm yazın";
            }
          }
          out.push({ tab: 0, id: "f-" + k, code: "", label: l, ok, why });
        });
        A_ITEMS.forEach(([c, l]) => {
          const q = val(c + ".q"),
            need = needIzah("A", q);
          let ok = q !== "",
            why = "qiymət seçilməyib";
          if (ok && need && val(c + ".i") === "") {
            ok = false;
            why = "izah yazılmayıb";
          }
          out.push({ tab: 1, id: "q-" + c, code: c, label: l, ok, why });
        });
        A_EXTRA.forEach((c) => {
          const s = val(c + ".s"),
            q = val(c + ".q"),
            i = val(c + ".i");
          if (s === "" && q === "" && i === "") return; // boşdursa, sayılmır
          let ok = true,
            why = "";
          if (s === "") {
            ok = false;
            why = "problemin adı yazılmayıb";
          } else if (q === "") {
            ok = false;
            why = "qiymət seçilməyib";
          } else if (needIzah("A", q) && i === "") {
            ok = false;
            why = "izah yazılmayıb";
          }
          out.push({
            tab: 1,
            id: "q-" + c,
            code: c,
            label: s || "Əlavə problem",
            ok,
            why,
          });
        });
        const seen = [];
        A_TOP.forEach((c, n) => {
          const p = val(c + ".p"),
            h = val(c + ".h");
          let ok = true,
            why = "";
          if (p === "") {
            ok = false;
            why = "problem seçilməyib";
          } else if (p !== "Digər" && seen.indexOf(p) >= 0) {
            ok = false;
            why = "eyni problem təkrar seçilib";
          } else if (h === "") {
            ok = false;
            why = "həll yolu yazılmayıb";
          }
          if (p) seen.push(p);
          out.push({
            tab: 1,
            id: "q-" + c,
            code: c,
            label: n + 1 + "-ci ən ciddi problem",
            ok,
            why,
          });
        });
        B_ITEMS.forEach(([c, l]) => {
          const q = val(c + ".q"),
            need = needIzah("B", q);
          let ok = q !== "",
            why = "qiymət seçilməyib";
          if (ok && need && val(c + ".i") === "") {
            ok = false;
            why = "izah yazılmayıb";
          }
          out.push({ tab: 2, id: "q-" + c, code: c, label: l, ok, why });
        });
        C_ITEMS.forEach(([c, l]) =>
          out.push({
            tab: 3,
            id: "q-" + c,
            code: c,
            label: l,
            ok: val(c + ".q") !== "",
            why: "cavab seçilməyib",
          })
        );
        D_ITEMS.forEach(([c, l]) =>
          out.push({
            tab: 4,
            id: "q-" + c,
            code: c,
            label: l,
            ok: val(c + ".q") !== "",
            why: "cavab yazılmayıb",
          })
        );
        return out;
      }

      /* ---------- Görünüşün qurulması ---------- */
      function scaleHtml(key, extra) {
        let h = '<div class="scale" role="group">';
        for (let i = 1; i <= 10; i++)
          h +=
            '<button type="button" class="opt" data-k="' +
            key +
            '" data-val="' +
            i +
            '">' +
            i +
            "</button>";
        h += "</div>";
        if (extra)
          h +=
            '<button type="button" class="opt wide" data-k="' +
            key +
            '" data-val="' +
            esc(extra) +
            '">' +
            esc(extra) +
            "</button>";
        return h;
      }
      function listHtml(key, opts) {
        return (
          '<div class="list" role="group">' +
          opts
            .map(
              (o) =>
                '<button type="button" class="opt" data-k="' +
                key +
                '" data-val="' +
                esc(o) +
                '">' +
                esc(o) +
                "</button>"
            )
            .join("") +
          "</div>"
        );
      }
      function izahHtml(code, label) {
        return (
          '<div class="izah" id="iz-' +
          code +
          '" data-lbl="' +
          esc(label) +
          '"><label class="lbl" for="i-' +
          code +
          '">' +
          esc(label) +
          "</label>" +
          '<textarea id="i-' +
          code +
          '" data-k="' +
          code +
          '.i" maxlength="2000"></textarea></div>'
        );
      }
      function qHtml(code, text, body) {
        return (
          '<section class="q" id="q-' +
          code +
          '"><div class="q-head"><span class="code">' +
          code +
          "</span>" +
          '<span class="q-text">' +
          esc(text) +
          "</span></div>" +
          body +
          "</section>"
        );
      }

      function panelE() {
        const f = (k, l, inner) =>
          '<div class="field" id="f-' +
          k +
          '"><label for="in-' +
          k +
          '">' +
          l +
          "</label>" +
          inner +
          "</div>";
        return (
          "<h1>Xidmətin təşkili və iş şəraiti üzrə sorğu</h1>" +
          '<p class="lead">Sorğunun məqsədi Penitensiar xidmətin müəssisə və idarələrində işə mane olan problemləri müəyyən etmək və xidmətin təşkilini təkmilləşdirməkdir.</p>' +
          (storageOk
            ? ""
            : '<div class="banner">Bu brauzerdə cavabları yadda saxlamaq mümkün deyil (gizli rejim ola bilər). Səhifəni bağlasanız, yazdıqlarınız itəcək. Sorğunu adi rejimdə açın və ya fasiləsiz doldurun.</div>') +
          '<div class="note"><ol>' +
          "<li>Hər sual üzrə öz təcrübənizə əsasən cavab verin. Düzgün və ya yanlış cavab yoxdur.</li>" +
          "<li>Bütün qiymətlər 1–10 şkalası ilə verilir. 7 və yuxarı problem qiymətləri, 3 və aşağı razılıq qiymətləri üçün konkret nümunə ilə izah mütləqdir.</li>" +
          "<li>Cavablarınız bu cihazda avtomatik saxlanılır. Fasilə verib eyni telefonda, eyni brauzerdə davam edə bilərsiniz.</li>" +
          "<li>Bütün bölmələri doldurduqdan sonra «Göndər» bölməsində cavabları göndərin. Göndərmək üçün internet lazımdır.</li>" +
          "</ol></div>" +
          '<details class="ex"><summary>Doldurulmuş cavab nümunəsi</summary>' +
          "<p><b>A.5</b> İş yükü və ştat çatışmazlığı. Qiymət: <b>8</b></p>" +
          "<p>İzah: Növbəyə 6 nəfər əvəzinə 4 nəfər çıxır. Hər əməkdaş ayda orta hesabla 3 əlavə növbə çəkir.</p></details>" +
          "<h2>Əməkdaş haqqında</h2>" +
          f(
            "E.qurum",
            "Qurumun adı",
            '<select id="in-E.qurum" data-k="E.qurum"><option value="">Seçin</option>' +
              QURUMLAR.map((q) => "<option>" + esc(q) + "</option>").join("") +
              "</select>"
          ) +
          '<div class="field" id="f-E.nov"><span class="lbl">Qurumun növü</span>' +
          listHtml("E.nov", QURUM_NOVLERI) +
          "</div>" +
          f(
            "E.saa",
            "Soyadı, adı, ata adı",
            '<input type="text" id="in-E.saa" data-k="E.saa" autocomplete="name" maxlength="120">'
          ) +
          f(
            "E.vezife",
            "Vəzifəsi",
            '<input type="text" id="in-E.vezife" data-k="E.vezife" maxlength="120">'
          ) +
          f(
            "E.rutbe",
            "Xüsusi rütbəsi",
            '<input type="text" id="in-E.rutbe" data-k="E.rutbe" maxlength="80">'
          ) +
          '<div class="two">' +
          f(
            "E.staj",
            "Penitensiar xidmətdə staj (il)",
            '<input type="number" id="in-E.staj" data-k="E.staj" inputmode="decimal" min="0" max="60" step="any">'
          ) +
          f(
            "E.muddet",
            "Bu qurumda iş müddəti (il)",
            '<input type="number" id="in-E.muddet" data-k="E.muddet" inputmode="decimal" min="0" max="60" step="any">'
          ) +
          "</div>" +
          f(
            "E.tarix",
            "Doldurulma tarixi",
            '<input type="date" id="in-E.tarix" data-k="E.tarix">'
          )
        );
      }
      function panelA() {
        let h =
          "<h1>A. İşə mane olan problemlər</h1>" +
          '<p class="lead">Hər sahənin işinizə nə dərəcədə mane olduğunu qiymətləndirin: 1–2 mane olmur, 3–4 az mane olur, 5–6 xeyli mane olur, 7–8 ciddi mane olur, 9–10 işi faktiki olaraq dayandırır. Sahə işinizə aid deyilsə, «Aid deyil» seçin.</p>';
        A_ITEMS.forEach(([c, l]) => {
          h += qHtml(
            c,
            l,
            scaleHtml(c + ".q", "Aid deyil") +
              '<div class="ends"><span>mane olmur</span><span>işi dayandırır</span></div>' +
              izahHtml(c, "İzah (konkret nümunə)")
          );
        });
        h +=
          '<h2>Siyahıda olmayan problem</h2><p class="lead">Varsa, adını yazın və qiymətləndirin. Yoxdursa, boş saxlayın.</p>';
        A_EXTRA.forEach((c) => {
          h +=
            '<section class="q" id="q-' +
            c +
            '"><div class="q-head"><span class="code">' +
            c +
            '</span><span class="q-text">Əlavə problem</span></div>' +
            '<div class="field"><input type="text" data-k="' +
            c +
            '.s" placeholder="Problemin adı" maxlength="160" aria-label="' +
            c +
            ' problemin adı"></div>' +
            scaleHtml(c + ".q", null) +
            '<div class="ends"><span>mane olmur</span><span>işi dayandırır</span></div>' +
            izahHtml(c, "İzah (konkret nümunə)") +
            "</section>";
        });
        h +=
          '<h2>Ən ciddi 3 problem</h2><p class="lead">Önəm sırası ilə seçin və hər birinin həll yolunu göstərin.</p>';
        A_TOP.forEach((c, n) => {
          h +=
            '<section class="q" id="q-' +
            c +
            '"><div class="q-head"><span class="code">' +
            c +
            '</span><span class="q-text">' +
            (n + 1) +
            "-ci ən ciddi problem</span></div>" +
            '<div class="field"><select data-k="' +
            c +
            '.p" aria-label="' +
            c +
            ' problem"><option value="">Siyahıdan seçin</option>' +
            A_LIST.map((o) => "<option>" + esc(o) + "</option>").join("") +
            "</select></div>" +
            '<label class="lbl sub" for="h-' +
            c +
            '">Necə həll olunmalıdır</label>' +
            '<textarea id="h-' +
            c +
            '" data-k="' +
            c +
            '.h" maxlength="2000"></textarea></section>';
        });
        return h;
      }
      function panelB() {
        let h =
          "<h1>B. İş mühiti</h1>" +
          '<p class="lead">Hər fikirlə nə dərəcədə razı olduğunuzu qiymətləndirin: 1–2 tamamilə razı deyiləm, 3–4 razı deyiləm, 5–6 qismən razıyam, 7–8 razıyam, 9–10 tamamilə razıyam.</p>';
        B_ITEMS.forEach(([c, l]) => {
          h += qHtml(
            c,
            l,
            scaleHtml(c + ".q", null) +
              '<div class="ends"><span>tamamilə razı deyiləm</span><span>tamamilə razıyam</span></div>' +
              izahHtml(c, "İzah (konkret nümunə)")
          );
        });
        return h;
      }
      function panelC() {
        let h =
          '<h1>C. İşin təşkili</h1><p class="lead">Hər sual üzrə bir cavab seçin. İzah yazmaq istəyə bağlıdır.</p>';
        C_ITEMS.forEach(([c, l, opts]) => {
          const body = opts
            ? listHtml(c + ".q", opts)
            : scaleHtml(c + ".q", null) +
              '<div class="ends"><span>çox pis</span><span>əla</span></div>';
          h += qHtml(c, l, body + izahHtml(c, "İzah (istəyə bağlı)"));
        });
        return h;
      }
      function panelD() {
        let h =
          '<h1>D. Təkliflər</h1><p class="lead">Öz sözlərinizlə, qısa və konkret yazın.</p>';
        D_ITEMS.forEach(([c, l]) => {
          h += qHtml(
            c,
            l,
            '<textarea data-k="' +
              c +
              '.q" maxlength="4000" style="min-height:130px" aria-label="' +
              c +
              '"></textarea>'
          );
        });
        return h;
      }
      function panelS() {
        return (
          '<h1>Cavabları göndər</h1><p class="lead">Göndərməzdən əvvəl bütün bölmələrin tam doldurulduğunu yoxlayın.</p>' +
          '<table class="sum"><thead><tr><th>Bölmə</th><th>Cavablanan</th></tr></thead><tbody id="sumBody"></tbody></table>' +
          '<div id="missWrap"></div><div id="sendMsg"></div>' +
          '<div style="margin-top:16px"><button class="btn" id="sendBtn" type="button">Cavabları göndər</button></div>' +
          '<div style="margin-top:6px;text-align:center"><button class="btn link" id="resetBtn" type="button">Formanı təmizlə və yenidən başla</button></div>'
        );
      }

      function build() {
        const panels = [
          panelE(),
          panelA(),
          panelB(),
          panelC(),
          panelD(),
          panelS(),
        ];
        $("main").innerHTML = panels
          .map(
            (p, i) =>
              '<div class="panel" id="p' +
              i +
              '" role="tabpanel">' +
              p +
              "</div>"
          )
          .join("");
        $("tabs").innerHTML = TABS.map(
          (t, i) =>
            '<button class="tab" role="tab" type="button" data-tab="' +
            i +
            '" id="t' +
            i +
            '">' +
            esc(t.t) +
            '<span class="cnt" id="c' +
            i +
            '"></span></button>'
        ).join("");
        // saxlanmış dəyərləri sahələrə yaz
        document
          .querySelectorAll("input[data-k],select[data-k],textarea[data-k]")
          .forEach((el) => {
            const x = S.v[el.dataset.k];
            if (x != null) el.value = x;
          });
        $("top").hidden = false;
        $("nav").hidden = false;
        goTab(Math.min(S.tab || 0, TABS.length - 1), true);
        update();
      }

      function update() {
        // seçilmiş düymələr
        document.querySelectorAll(".opt[data-k]").forEach((b) => {
          const on =
            String(S.v[b.dataset.k] == null ? "" : S.v[b.dataset.k]) ===
            b.dataset.val;
          b.classList.toggle("sel", on);
          b.setAttribute("aria-pressed", on ? "true" : "false");
        });
        // məcburi izahlar
        A_ITEMS.map((x) => x[0])
          .concat(A_EXTRA)
          .forEach((c) => markIzah(c, needIzah("A", val(c + ".q"))));
        B_ITEMS.forEach(([c]) => markIzah(c, needIzah("B", val(c + ".q"))));
        // say və faiz
        const st = statusList();
        const per = [0, 1, 2, 3, 4].map((i) => {
          const a = st.filter((x) => x.tab === i);
          return [a.filter((x) => x.ok).length, a.length];
        });
        per.forEach(([d, n], i) => {
          $("c" + i).textContent = d === n ? "✓" : d + "/" + n;
          $("t" + i).classList.toggle("done", d === n);
        });
        st.forEach((x) => {
          const el = $(x.id);
          if (el && el.classList.contains("q")) el.classList.toggle("ok", x.ok);
        });
        const done = st.filter((x) => x.ok).length,
          pct = Math.round((done / st.length) * 100);
        $("pct").textContent = pct + "%";
        $("bar").style.width = pct + "%";
        // göndər paneli
        const names = [
          "Əməkdaş haqqında",
          "A. İşə mane olan problemlər",
          "B. İş mühiti",
          "C. İşin təşkili",
          "D. Təkliflər",
        ];
        $("sumBody").innerHTML =
          per
            .map(
              ([d, n], i) =>
                "<tr><td>" +
                names[i] +
                "</td><td>" +
                d +
                " / " +
                n +
                "</td></tr>"
            )
            .join("") +
          "<tr><td>Cəmi</td><td>" +
          done +
          " / " +
          st.length +
          "</td></tr>";
        const miss = st.filter((x) => !x.ok);
        $("missWrap").innerHTML = miss.length
          ? "<h2>Tamamlanmalı olanlar (" +
            miss.length +
            ')</h2><ul class="miss">' +
            miss
              .map(
                (x) =>
                  '<li><button type="button" data-go="' +
                  x.tab +
                  '" data-el="' +
                  esc(x.id) +
                  '">' +
                  (x.code ? "<b>" + esc(x.code) + "</b> " : "") +
                  esc(
                    x.label.length > 60 ? x.label.slice(0, 58) + "…" : x.label
                  ) +
                  " <span>(" +
                  esc(x.why) +
                  ")</span></button></li>"
              )
              .join("") +
            "</ul>"
          : '<div class="msg info">Bütün suallar cavablandırılıb. Cavabları göndərə bilərsiniz.</div>';
        $("sendBtn").disabled = miss.length > 0 || sending;
      }
      function markIzah(code, req) {
        const w = $("iz-" + code);
        if (!w) return;
        w.classList.toggle("req", req);
        w.querySelector(".lbl").textContent = req
          ? "İzah mütləqdir: konkret nümunə yazın"
          : w.dataset.lbl;
      }

      function goTab(i, keepScroll) {
        S.tab = i;
        document
          .querySelectorAll(".panel")
          .forEach((p, n) => p.classList.toggle("on", n === i));
        document.querySelectorAll(".tab").forEach((t, n) => {
          t.setAttribute("aria-selected", n === i ? "true" : "false");
          if (n === i && t.scrollIntoView)
            t.scrollIntoView({ block: "nearest", inline: "center" });
        });
        $("prev").disabled = i === 0;
        $("next").hidden = i === TABS.length - 1;
        $("next").textContent =
          i === TABS.length - 2 ? "Göndərməyə keç" : "Növbəti";
        if (!keepScroll) window.scrollTo(0, 0);
        save();
      }

      /* ---------- Hadisələr ---------- */
      document.addEventListener("input", (e) => {
        const k = e.target.dataset && e.target.dataset.k;
        if (!k) return;
        S.v[k] = e.target.value;
        save();
        update();
      });
      document.addEventListener("change", (e) => {
        const k = e.target.dataset && e.target.dataset.k;
        if (!k) return;
        S.v[k] = e.target.value;
        save(true);
        update();
      });
      document.addEventListener("click", (e) => {
        const opt = e.target.closest(".opt[data-k]");
        if (opt) {
          const k = opt.dataset.k;
          S.v[k] = String(S.v[k]) === opt.dataset.val ? "" : opt.dataset.val;
          save(true);
          update();
          return;
        }
        const tab = e.target.closest(".tab");
        if (tab) {
          goTab(Number(tab.dataset.tab));
          return;
        }
        const go = e.target.closest("[data-go]");
        if (go) {
          goTab(Number(go.dataset.go), true);
          const el = $(go.dataset.el);
          if (el) {
            el.scrollIntoView({ block: "center" });
            el.classList.add("flash");
            setTimeout(() => el.classList.remove("flash"), 1600);
          }
          return;
        }
        if (e.target.id === "prev") goTab(Math.max(0, S.tab - 1));
        else if (e.target.id === "next")
          goTab(Math.min(TABS.length - 1, S.tab + 1));
        else if (e.target.id === "sendBtn") send();
        else if (e.target.id === "resetBtn") {
          if (confirm("Bütün yazdıqlarınız silinəcək. Davam edilsin?")) {
            S = fresh();
            save(true);
            build();
            window.scrollTo(0, 0);
          }
        } else if (e.target.id === "newBtn") {
          S = fresh();
          save(true);
          build();
          window.scrollTo(0, 0);
        } else if (e.target.id === "dlBtn") downloadJson();
      });
      window.addEventListener("pagehide", () => save(true));

      /* ---------- Göndərmə ---------- */
      function numOrText(x) {
        return isNum(x) ? Number(x) : x;
      }
      function buildPayload() {
        const yr = (k) => Number(val(k).replace(",", "."));
        const row = [];
        const emekdas = {
          qurum: val("E.qurum"),
          qurum_novu: val("E.nov"),
          soyad_ad_ata_adi: val("E.saa"),
          vezife: val("E.vezife"),
          xususi_rutbe: val("E.rutbe"),
          xidmet_staji_il: yr("E.staj"),
          qurumda_is_muddeti_il: yr("E.muddet"),
          doldurulma_tarixi: val("E.tarix"),
        };
        row.push(
          ["Qurum", emekdas.qurum],
          ["Qurumun növü", emekdas.qurum_novu],
          ["Soyadı, adı, ata adı", emekdas.soyad_ad_ata_adi],
          ["Vəzifəsi", emekdas.vezife],
          ["Xüsusi rütbəsi", emekdas.xususi_rutbe],
          ["Xidmət stajı (il)", emekdas.xidmet_staji_il],
          ["Bu qurumda iş müddəti (il)", emekdas.qurumda_is_muddeti_il],
          ["Doldurulma tarixi", emekdas.doldurulma_tarixi]
        );

        const A = {},
          B = {},
          C = {},
          D = {};
        A_ITEMS.forEach(([c, l]) => {
          A[c] = {
            sahe: l,
            qiymet: numOrText(val(c + ".q")),
            izah: val(c + ".i"),
          };
          row.push([c + " qiymət", A[c].qiymet], [c + " izah", A[c].izah]);
        });
        A_EXTRA.forEach((c) => {
          A[c] = {
            sahe: val(c + ".s"),
            qiymet: numOrText(val(c + ".q")),
            izah: val(c + ".i"),
          };
          row.push(
            [c + " sahə", A[c].sahe],
            [c + " qiymət", A[c].qiymet],
            [c + " izah", A[c].izah]
          );
        });
        A.en_ciddi_3 = A_TOP.map((c, n) => {
          const o = {
            kod: c,
            sira: n + 1,
            problem: val(c + ".p"),
            hell_yolu: val(c + ".h"),
          };
          row.push(
            [c + " problem", o.problem],
            [c + " həll yolu", o.hell_yolu]
          );
          return o;
        });
        B_ITEMS.forEach(([c, l]) => {
          B[c] = {
            fikir: l,
            qiymet: numOrText(val(c + ".q")),
            izah: val(c + ".i"),
          };
          row.push([c + " qiymət", B[c].qiymet], [c + " izah", B[c].izah]);
        });
        C_ITEMS.forEach(([c, l]) => {
          C[c] = {
            sual: l,
            cavab: numOrText(val(c + ".q")),
            izah: val(c + ".i"),
          };
          row.push([c + " cavab", C[c].cavab], [c + " izah", C[c].izah]);
        });
        D_ITEMS.forEach(([c, l]) => {
          D[c] = { sual: l, cavab: val(c + ".q") };
          row.push([c, D[c].cavab]);
        });

        return {
          id: S.id,
          versiya: 1,
          gonderilme_vaxti: new Date().toISOString(),
          emekdas,
          A_problemler: A,
          B_is_muhiti: B,
          C_isin_teskili: C,
          D_teklifler: D,
          setir: row,
        };
      }
      let sending = false;
      function showMsg(cls, html) {
        $("sendMsg").innerHTML = html
          ? '<div class="msg ' + cls + '">' + html + "</div>"
          : "";
      }
      async function send() {
        if (sending) return;
        if (statusList().some((x) => !x.ok)) {
          update();
          return;
        }
        if (!/^https:\/\//.test(CONFIG.SCRIPT_URL)) {
          showMsg(
            "err",
            "Göndərmə ünvanı qurulmayıb. Sorğu üzrə məsul şəxsə məlumat verin."
          );
          return;
        }
        if (navigator.onLine === false) {
          showMsg(
            "err",
            "İnternet bağlantısı yoxdur. Cavablarınız bu cihazda saxlanılıb. İnternet olanda yenidən «Cavabları göndər» basın."
          );
          return;
        }
        sending = true;
        $("sendBtn").textContent = "Göndərilir…";
        update();
        showMsg("", "");
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 45000);
        try {
          const res = await fetch(CONFIG.SCRIPT_URL, {
            method: "POST",
            redirect: "follow",
            signal: ctrl.signal,
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(buildPayload()),
          });
          const r = await res.json();
          if (!r || !r.ok)
            throw new Error((r && r.xeta) || "Server cavabı qəbul etmədi");
          S.sent = { at: new Date().toISOString() };
          save(true);
          renderSent();
        } catch (err) {
          const m =
            err && err.name === "AbortError"
              ? "Bağlantı çox ləngdir."
              : "Göndərmək alınmadı.";
          showMsg(
            "err",
            m +
              " Cavablarınız bu cihazda saxlanılıb, bir az sonra yenidən cəhd edin. " +
              'Alınmasa, cavab faylını yükləyib məsul şəxsə verin.<br><span style="font-size:13px;opacity:.85">' +
              esc(String((err && err.message) || err)) +
              "</span>" +
              '<div style="margin-top:10px"><button class="btn ghost" id="dlBtn" type="button">Cavab faylını yüklə (JSON)</button></div>'
          );
        } finally {
          clearTimeout(timer);
          sending = false;
          const b = $("sendBtn");
          if (b) {
            b.textContent = "Cavabları göndər";
            update();
          }
        }
      }
      function downloadJson() {
        const p = buildPayload();
        delete p.setir;
        const blob = new Blob([JSON.stringify(p, null, 2)], {
          type: "application/json",
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = (p.emekdas.qurum || "sorgu") + "_" + S.id + ".json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      }
      function renderSent() {
        $("top").hidden = true;
        $("nav").hidden = true;
        const d = new Date(S.sent.at);
        $("main").innerHTML =
          '<div class="sent"><div class="tick">✓</div><h1>Cavablarınız göndərildi</h1>' +
          "<p>Sorğuda iştirakınız üçün təşəkkür edirik.</p>" +
          '<p>Qurum: <span class="id">' +
          esc(val("E.qurum")) +
          '</span><br>Vaxt: <span class="id">' +
          esc(d.toLocaleString("az-AZ")) +
          "</span><br>" +
          'Qeyd nömrəsi: <span class="id">' +
          esc(S.id.slice(0, 8)) +
          "</span></p>" +
          '<div style="max-width:360px;margin:28px auto 0"><button class="btn ghost" id="newBtn" type="button">Başqa əməkdaş üçün yeni sorğu</button></div></div>';
        window.scrollTo(0, 0);
      }

      /* ---------- Başlanğıc ---------- */
      if (S.sent) renderSent();
      else build();
    </script>
  </body>
</html>
